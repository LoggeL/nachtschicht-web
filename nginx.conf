# Extend /etc/nginx/mime.types (nginx 1.27 already maps .webp -> image/webp and .wasm -> application/wasm)
types {
    model/gltf-binary glb;
    model/gltf+json   gltf;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Compression for text, JS/CSS, JSON, SVG, WASM, and 3D glTF/GLB assets
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        text/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        model/gltf-binary
        model/gltf+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Container / Swarm / Dokploy healthcheck endpoint
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # Immutable long-term caching for Vite-bundled and static /assets/ (models, artwork, hashed bundles)
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Ensure index.html revalidates so new deployments take effect immediately
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
